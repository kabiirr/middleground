<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 330">
  <!--
    The studio's mark, for the browser tab.

    One file for both themes. A tab strip is near-white in a light system and
    near-black in a dark one, and a mark that only works against one of them
    disappears against the other — which is what a flat black favicon does the
    moment someone turns the lights off. The fill is set here rather than on
    the paths so the media query can answer for all three at once.
  -->
  <style>
    path { fill: #000; }
    @media (prefers-color-scheme: dark) { path { fill: #fff; } }
  </style>
